<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F4F8FD">
<title>名络 · 开启通讯录同步</title>
<style>
/* finesse · register=h5 · morph=A-app-shell · A=ice-blue-monochrome · B=brand-lockup/body
 * C=single-screen-permission-guide · D=feedback-only · E=trusted-contact-sync · SOUL=6 SPECTACLE=2 DENSITY=5 */
:root{
  --page:#F4F8FD;--surface:#FCFDFF;--surface-soft:#F1F6FF;
  --brand:#0964FC;--brand-pressed:#0754D5;--text:#1D2129;
  --text-2:#4E5969;--text-3:#86909C;--danger:#F53F3F;
  --success:#00B42A;--focus:rgba(9,100,252,.28);--on-brand:#F8FBFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:clip}
body{margin:0;display:grid;place-items:center;padding:24px;overflow:hidden;background:var(--page);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.device{position:relative;width:min(390px,100vw);height:min(844px,100dvh);overflow:hidden;isolation:isolate;background:var(--page) url("../icon/bg.png") center/cover no-repeat;border-radius:38px;box-shadow:0 0 0 1px rgba(23,25,35,.1),0 24px 48px rgba(23,25,35,.16)}
.status-sim{position:absolute;z-index:10;top:0;left:20px;right:20px;height:44px;display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:12px;font-weight:700;pointer-events:none}.status-sim__time{letter-spacing:.01em;font-variant-numeric:tabular-nums}.status-sim__right{display:flex;align-items:center;gap:9px}.status-sim__signal{width:17px;height:15px;display:flex;align-items:flex-end;gap:2px}.status-sim__signal i{display:block;width:3px;border-radius:2px;background:currentColor}.status-sim__signal i:nth-child(1){height:5px}.status-sim__signal i:nth-child(2){height:8px}.status-sim__signal i:nth-child(3){height:11px}.status-sim__signal i:nth-child(4){height:14px}.status-sim__wifi{position:relative;width:17px;height:15px;overflow:hidden}.status-sim__wifi:before,.status-sim__wifi:after{content:"";position:absolute;left:50%;border:2px solid currentColor;border-left-color:transparent;border-right-color:transparent;border-bottom-color:transparent;border-radius:50% 50% 0 0;transform:translateX(-50%)}.status-sim__wifi:before{top:1px;width:17px;height:12px}.status-sim__wifi:after{top:5px;width:9px;height:7px}.status-sim__wifi i{position:absolute;left:50%;bottom:1px;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}.status-sim__battery{position:relative;width:25px;height:13px;padding:2px;border:1.5px solid currentColor;border-radius:4px}.status-sim__battery:after{content:"";position:absolute;top:3px;right:-4px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}.status-sim__battery i{display:block;width:80%;height:100%;border-radius:1px;background:var(--success)}
.status-sim__battery,.status-sim__battery i{background:transparent}
.status-sim{background:transparent}
.sync-page{position:absolute;inset:44px 0 0;overflow-y:auto;overflow-x:clip;scrollbar-width:none;padding-bottom:calc(24px + env(safe-area-inset-bottom))}.sync-page::-webkit-scrollbar{display:none}
.subnav{position:absolute;z-index:8;top:0;left:24px;right:24px;height:44px;display:flex;align-items:center}.back-button{width:44px;height:44px;margin-left:-12px;padding:12px;border:0;background:transparent;cursor:pointer;transition:transform .12s}.back-button:active{transform:scale(.94)}.back-icon{display:block;width:20px;height:20px;object-fit:contain}
.brand-hero{position:absolute;z-index:2;top:56px;left:24px;right:24px;height:150px}.brand-lockup{position:absolute;z-index:2;top:2px;left:0;width:144px}.brand-lockup img{display:block;width:144px;height:auto;user-select:none;-webkit-user-drag:none}.sync-illustration{position:absolute;z-index:1;top:0;right:-3px;width:180px;height:auto;display:block;opacity:.78;user-select:none;-webkit-user-drag:none;pointer-events:none}
.intro{position:absolute;z-index:3;top:216px;left:28px;right:28px}.intro h1{margin:0;color:var(--text);font-size:29px;line-height:38px;font-weight:700;letter-spacing:-.035em}.intro p{margin:8px 0 0;color:#64748B;font-size:16px;line-height:24px}
.trust-list{position:absolute;z-index:3;top:320px;left:27px;right:27px;display:grid;gap:13px}.trust-item{height:56px;padding:0 16px 0 14px;display:flex;align-items:center;gap:14px;background:rgba(252,253,255,.96);border:0;border-radius:12px;box-shadow:none}.trust-item img{width:34px;height:34px;flex:none;display:block;object-fit:cover}.trust-item span{min-width:0;color:#15203A;font-size:15px;line-height:22px;font-weight:500;white-space:nowrap}
.actions{position:absolute;z-index:4;top:540px;left:27px;right:27px;text-align:center}.primary{width:100%;height:52px;border:0;border-radius:26px;display:flex;align-items:center;justify-content:center;background:var(--brand);color:var(--on-brand);font-size:17px;font-weight:500;cursor:pointer;box-shadow:none;transition:background-color .12s,transform .12s}.primary:active:not(:disabled){background:var(--brand-pressed);transform:scale(.975)}.primary:disabled{cursor:default;opacity:.72}.primary.is-loading{pointer-events:none}.primary.is-loading:before{content:"";width:16px;height:16px;margin-right:8px;border:2px solid rgba(248,251,255,.44);border-top-color:var(--on-brand);border-radius:50%;animation:spin .7s linear infinite}.later{min-width:120px;min-height:44px;margin-top:12px;padding:0 16px;border:0;background:transparent;color:var(--brand);font-size:15px;font-weight:500;cursor:pointer;transition:transform .12s,color .12s}.later:active{color:var(--brand-pressed);transform:scale(.97)}
.primary.cancel-sync{background:#FFFFFF;color:#F04438}
.state-note{position:absolute;z-index:16;left:24px;right:24px;bottom:calc(26px + env(safe-area-inset-bottom));min-height:46px;padding:11px 16px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(29,33,41,.94);color:var(--on-brand);font-size:12px;line-height:18px;text-align:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s}.state-note.show{opacity:1;transform:translateY(0)}.state-note.is-error{background:rgba(165,43,43,.95)}.state-note.is-success{background:rgba(20,112,58,.95)}
.permission-modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center}.permission-modal[hidden]{display:none!important}.permission-backdrop{position:absolute;inset:0;background:rgba(23,24,32,.28)}.permission-card{position:relative;width:calc(100% - 40px);margin:0;padding:22px 20px 20px;border-radius:20px;background:var(--surface);box-shadow:0 8px 24px rgba(23,24,32,.16)}.permission-card h2{margin:0;color:var(--text);font-size:18px;line-height:26px;font-weight:600}.permission-card p{margin:8px 0 0;color:var(--text-2);font-size:13px;line-height:20px}.permission-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:18px}.permission-actions button{height:44px;border:0;border-radius:22px;font-size:14px;font-weight:500;cursor:pointer}.permission-cancel{background:#F1F2F5;color:var(--text)}.permission-confirm{background:var(--brand);color:var(--on-brand)}.permission-actions button:active{transform:scale(.975)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:430px){body{padding:0}.device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
@media(max-width:379px){.brand-hero{left:20px;right:20px}.intro{left:24px;right:24px}.trust-list,.actions{left:24px;right:24px}.trust-item{padding-left:12px;gap:11px}.trust-item span{font-size:14px}.sync-illustration{right:-4px;width:174px}}
@media(min-width:560px){.device{width:390px;height:min(844px,94vh)}}
@media(max-height:760px){.actions{top:532px}}
@media(prefers-reduced-motion:reduce){.back-button,.primary,.later,.state-note{transition:none}.primary.is-loading:before{animation:none}}
</style>
</head>
<body>
<main class="device" aria-label="名络首次登录通讯录同步引导">
  <div class="status-sim" aria-label="模拟状态栏，当前电量 80%"><span class="status-sim__time">14:44</span><span class="status-sim__right"><span class="status-sim__signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="status-sim__wifi" aria-hidden="true"><i></i></span><span class="status-sim__battery" aria-hidden="true"><i></i></span></span></div>

  <section class="sync-page" aria-labelledby="sync-title">
    <nav class="subnav" aria-label="通讯录同步导航"><button class="back-button" id="back-login" type="button" aria-label="返回登录页"><img class="back-icon" src="../icon/返回.svg" alt=""></button></nav>
    <div class="brand-hero">
      <div class="brand-lockup"><img src="../icon/LOGOpng.png" width="306" height="156" alt="名络，连接每一段重要关系"></div>
      <img class="sync-illustration" src="assets/sync/contact-book.png" width="1182" height="1045" alt="通讯录同步">
    </div>

    <header class="intro"><h1 id="sync-title">开启通讯录同步</h1><p>更高效地管理联系人</p></header>

    <div class="trust-list" aria-label="通讯录同步安全说明">
      <div class="trust-item"><img src="assets/sync/permission.png" width="76" height="76" alt=""><span>仅在你授权后同步</span></div>
      <div class="trust-item"><img src="assets/sync/preview.png" width="76" height="76" alt=""><span>合并前可预览，不会丢失信息</span></div>
      <div class="trust-item"><img src="assets/sync/encryption.png" width="76" height="76" alt=""><span>数据全程加密保护</span></div>
    </div>

    <div class="actions"><button class="primary" id="start-scan" type="button">开始扫描</button><button class="later" id="later" type="button">稍后再说</button></div>
  </section>

  <div class="state-note" id="state-note" role="status" aria-live="polite"></div>
  <div class="permission-modal" id="permission-modal" hidden>
    <div class="permission-backdrop"></div>
    <section class="permission-card" role="dialog" aria-modal="true" aria-labelledby="permission-title" aria-describedby="permission-description">
      <h2 id="permission-title">允许“名络”访问你的通讯录吗？</h2>
      <p id="permission-description">用于扫描、预览与同步联系人；未经授权不会读取通讯录。</p>
      <div class="permission-actions"><button class="permission-cancel" id="deny" type="button">不允许</button><button class="permission-confirm" id="allow" type="button">允许</button></div>
    </section>
  </div>
</main>
<script>
(() => {
  const q = selector => document.querySelector(selector);
  const startButton = q('#start-scan');
  const laterButton = q('#later');
  const modal = q('#permission-modal');
  const note = q('#state-note');
  const params = new URLSearchParams(location.search);
  const simulatedPermission = params.get('permission');
  const enabledMode = params.get('mode') === 'enabled';
  let syncEnabled = enabledMode && params.get('sync') !== 'disabled';
  let noteTimer = 0;

  const enterHome = (empty = false) => {
    location.href = `index.html?login=success${empty ? '&state=empty' : ''}#screen-01`;
  };

  const showNote = (message, tone = '') => {
    note.textContent = message;
    note.className = `state-note show${tone ? ` is-${tone}` : ''}`;
    clearTimeout(noteTimer);
    noteTimer = window.setTimeout(() => note.classList.remove('show'), 3200);
  };
  const setReady = (label = '开始扫描') => {
    startButton.disabled = false;
    startButton.classList.remove('is-loading');
    startButton.textContent = label;
    laterButton.disabled = false;
  };
  const setLoading = () => {
    modal.hidden = true;
    startButton.disabled = true;
    startButton.classList.add('is-loading');
    startButton.textContent = '正在检查通讯录';
    laterButton.disabled = true;
  };
  const finishAuthorization = () => {
    setLoading();
    window.setTimeout(() => {
      if (simulatedPermission === 'error') {
        setReady('重新扫描');
        showNote('通讯录读取失败，请检查系统权限后重试', 'error');
        return;
      }
      startButton.classList.remove('is-loading');
      startButton.textContent = '通讯录同步已开启';
      startButton.disabled = true;
      if (enabledMode) {
        syncEnabled = true;
        q('#sync-title').textContent = '已开启同步通讯录';
        startButton.disabled = false;
        startButton.textContent = '取消同步通讯录';
        startButton.classList.add('cancel-sync');
        showNote('通讯录同步已重新开启', 'success');
      } else enterHome();
    }, 900);
  };
  const openPermission = () => {
    modal.hidden = false;
    q('#allow').focus();
  };

  startButton.addEventListener('click', () => {
    if (!enabledMode || !syncEnabled) {
      openPermission();
      return;
    }
    syncEnabled = false;
    startButton.classList.remove('cancel-sync');
    startButton.textContent = '重新开启同步';
    q('#sync-title').textContent = '通讯录同步已关闭';
    showNote('已取消通讯录同步，现有联系人不会被删除');
  });
  q('#deny').addEventListener('click', () => {
    modal.hidden = true;
    setReady('重新开启权限');
    showNote('未获得通讯录权限，可随时再次尝试', 'error');
    startButton.focus();
  });
  q('#allow').addEventListener('click', finishAuthorization);
  q('.permission-backdrop').addEventListener('click', () => {
    modal.hidden = true;
    startButton.focus();
  });
  laterButton.addEventListener('click', () => {
    if (enabledMode) location.href = `index.html?sync=${syncEnabled ? 'enabled' : 'disabled'}#screen-08`;
    else enterHome(true);
  });
  q('#back-login').addEventListener('click', () => { location.href = enabledMode ? `index.html?sync=${syncEnabled ? 'enabled' : 'disabled'}#screen-08` : 'login.html'; });

  if (enabledMode) {
    q('#sync-title').textContent = syncEnabled ? '已开启同步通讯录' : '通讯录同步已关闭';
    q('.intro p').textContent = '联系人变化将在本机安全同步';
    startButton.textContent = syncEnabled ? '取消同步通讯录' : '重新开启同步';
    startButton.classList.toggle('cancel-sync', syncEnabled);
    laterButton.textContent = '返回我的';
  }

  if (simulatedPermission === 'denied') {
    setReady('重新开启权限');
    window.setTimeout(() => showNote('未获得通讯录权限，可随时再次尝试', 'error'), 120);
  } else if (simulatedPermission === 'loading') {
    setLoading();
  } else if (simulatedPermission === 'allowed') {
    startButton.textContent = '通讯录同步已开启';
    startButton.disabled = true;
    laterButton.textContent = '返回登录页';
    window.setTimeout(() => showNote('已获得通讯录权限，扫描准备完成', 'success'), 120);
  }

  const clock = q('.status-sim__time');
  const now = new Date();
  clock.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
})();
</script>
</body>
</html>
