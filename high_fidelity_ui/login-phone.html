<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F4F8FD">
<title>名络 · 其他手机号登录</title>
<style>
/* finesse · register=h5 · morph=A-app-shell · A=ice-blue-monochrome · B=brand-lockup/body
 * C=single-screen-form · D=state-transition · E=connected-verification · SOUL=6 SPECTACLE=2 DENSITY=5 */
:root{
  --canvas:#F4F8FD;--page:#F4F8FD;--surface:#FCFDFF;--surface-soft:#F7F8FA;
  --brand:#0964FC;--brand-pressed:#0754D5;--brand-soft:#E7F0FF;--brand-wash:#F1F6FF;
  --text:#171820;--text-2:#4E5969;--text-3:#86909C;--line:#E5E6EB;
  --success:#00B42A;--warning:#FF7D00;--danger:#F53F3F;--disabled:#C9CDD4;
  --focus:rgba(9,100,252,.28);--outline:rgba(9,100,252,.38);--shadow:rgba(9,100,252,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:clip}
body{margin:0;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.device{width:min(390px,100vw);height:min(844px,100dvh);position:relative;overflow:hidden;background:var(--page);border-radius:38px;box-shadow:0 0 0 1px rgba(23,25,35,.1),0 24px 48px rgba(23,25,35,.16);isolation:isolate}
.status-sim{position:absolute;z-index:10;top:13px;left:20px;right:20px;height:22px;display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:12px;font-weight:700;pointer-events:none}.status-sim__time{letter-spacing:.01em;font-variant-numeric:tabular-nums}.status-sim__right{display:flex;align-items:center;gap:9px}.status-sim__signal{width:17px;height:15px;display:flex;align-items:flex-end;gap:2px}.status-sim__signal i{display:block;width:3px;border-radius:2px;background:currentColor}.status-sim__signal i:nth-child(1){height:5px}.status-sim__signal i:nth-child(2){height:8px}.status-sim__signal i:nth-child(3){height:11px}.status-sim__signal i:nth-child(4){height:14px}.status-sim__wifi{position:relative;width:17px;height:15px;overflow:hidden}.status-sim__wifi:before,.status-sim__wifi:after{content:"";position:absolute;left:50%;border:2px solid currentColor;border-left-color:transparent;border-right-color:transparent;border-bottom-color:transparent;border-radius:50% 50% 0 0;transform:translateX(-50%)}.status-sim__wifi:before{top:1px;width:17px;height:12px}.status-sim__wifi:after{top:5px;width:9px;height:7px}.status-sim__wifi i{position:absolute;left:50%;bottom:1px;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}.status-sim__battery{position:relative;width:25px;height:13px;padding:2px;border:1.5px solid currentColor;border-radius:4px}.status-sim__battery:after{content:"";position:absolute;top:3px;right:-4px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}.status-sim__battery i{display:block;width:80%;height:100%;border-radius:1px;background:var(--success)}
.status-sim__battery,.status-sim__battery i{background:transparent}
.status-sim{background:transparent}
.page{height:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:calc(28px + env(safe-area-inset-top)) clamp(24px,9.23vw,36px) calc(32px + env(safe-area-inset-bottom));scrollbar-width:none;background:var(--page)}
.page::-webkit-scrollbar{display:none}
.subnav{height:44px;width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;margin:0;flex:none}.subnav button{min-width:44px;height:44px;padding:0;border:0;background:transparent;color:var(--text);font-size:0;cursor:pointer;transition:transform .12s}.subnav button:active{transform:scale(.94)}.subnav h1{margin:0;font-size:0}.back-chevron{display:block;width:18px;height:18px;margin-left:0;background:currentColor;clip-path:polygon(0 50%,100% 0,100% 18%,24% 50%,100% 82%,100% 100%)}
.brand-lockup{position:relative;z-index:2;margin-top:65px;width:144px;align-self:center}.brand-lockup img{display:block;width:144px;height:auto;user-select:none;-webkit-user-drag:none}
.subpage-intro{position:relative;z-index:3;width:100%;margin:86px 0 20px;text-align:center}.subpage-intro h2{margin:0;color:var(--text);font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.04em}.subpage-intro p{margin:6px 0 0;color:var(--text-2);font-size:16px;line-height:24px}
.fallback-card{position:relative;z-index:3;width:100%;padding:0;background:transparent;border-radius:12px}
.fallback-card.is-loading{pointer-events:none}
.fallback-notice{margin:0 0 16px;padding:12px 16px;border-radius:12px;background:var(--surface-soft);color:var(--danger);font-size:12px;line-height:17px}
.mode-label{display:none}
.field{height:56px;padding:0 20px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid rgba(205,222,243,.72);border-radius:16px;box-shadow:none;transition:border-color .16s,background-color .16s}
.field+.field{margin-top:16px}.field:focus-within{background:var(--surface);border:2px solid var(--brand);box-shadow:none}
.prefix{font-size:14px;font-weight:500;color:var(--text-2);padding-right:8px;border-right:1px solid var(--line);white-space:nowrap}
.field input{height:100%;min-width:0;flex:1;padding:0;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;font-weight:700;text-align:center}.field input::placeholder{color:var(--text-3)}
.inline-action{min-width:96px;min-height:44px;padding:0;border:0;background:transparent;color:var(--brand);font-size:14px;font-weight:500;text-align:right;white-space:nowrap;cursor:pointer;font-variant-numeric:tabular-nums;transition:color .12s,transform .12s}
.inline-action:active:not(:disabled){transform:scale(.97);color:var(--brand-pressed)}.inline-action:disabled{background:transparent;color:var(--disabled);cursor:default}
.error{min-height:0;padding:0;color:var(--danger);font-size:12px;line-height:17px}
.submit{width:100%;height:48px;margin-top:20px;border:0;border-radius:24px;display:flex;align-items:center;justify-content:center;background:var(--brand);color:#F8FBFF;font-size:17px;font-weight:500;cursor:pointer;transition:background-color .12s,transform .12s;box-shadow:none}
.submit:active:not(:disabled){background:var(--brand-pressed);transform:scale(.975)}.submit:disabled{background:var(--disabled);cursor:default}.submit.loading{pointer-events:none}
.submit.loading:before{content:"";width:15px;height:15px;margin-right:8px;border:2px solid rgba(248,251,255,.45);border-top-color:#F8FBFF;border-radius:50%;animation:spin .7s linear infinite}
.code-hint{margin:16px 0 0;color:var(--warning);font-size:14px;line-height:20px;text-align:center}
.agreement{position:relative;display:flex;align-items:flex-start;gap:8px;margin:16px 0 0;color:var(--text-3);font-size:12px;line-height:17px;cursor:pointer}
.agreement input{appearance:none;width:20px;height:20px;flex:none;margin:0;border:1.5px solid var(--disabled);border-radius:50%;background:var(--surface);cursor:pointer}
.agreement input:checked{width:20px;height:20px;border-color:var(--brand);background:var(--brand)}.agreement input:checked:after{content:"✓";height:100%;display:grid;place-items:center;color:#F8FBFF;font-size:13px;font-weight:700;line-height:1}.agreement a{color:var(--brand);text-decoration:none}
.toast{position:absolute;left:20px;right:20px;top:50%;bottom:auto;min-height:46px;padding:10px 14px;border-radius:12px;background:rgba(23,24,32,.94);color:#F8FBFF;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;z-index:20;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s;box-shadow:0 8px 24px rgba(23,24,32,.12)}
.toast.show{opacity:1;transform:translateY(0)}
.consent-modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center}.consent-modal[hidden]{display:none!important}.consent-backdrop{position:absolute;inset:0;background:rgba(23,24,32,.28)}.consent-sheet{position:relative;width:calc(100% - 40px);margin:0;padding:22px 20px 20px;border-radius:20px;background:var(--surface);box-shadow:0 8px 24px rgba(23,24,32,.16)}.consent-sheet h2{margin:0;color:var(--text);font-size:18px;line-height:26px;font-weight:600}.consent-sheet p{margin:8px 0 0;color:var(--text-2);font-size:13px;line-height:20px}.consent-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:18px}.consent-actions button{height:44px;border:0;border-radius:22px;font-size:14px;font-weight:500;cursor:pointer}.consent-cancel{background:#F1F2F5;color:var(--text)}.consent-confirm{background:var(--brand);color:#F8FBFF}.consent-actions button:active{transform:scale(.975)}
.success-view{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:176px 20px 42px;background:linear-gradient(180deg,var(--brand-wash),var(--page) 58%)}
.success-icon{width:64px;height:64px;border-radius:12px;background:var(--success);color:#F8FBFF;display:grid;place-items:center}.success-icon svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.success-view h2{font-size:28px;line-height:36px;letter-spacing:-.025em;margin:20px 0 0}.success-view p{font-size:14px;line-height:22px;color:var(--text-2);margin:8px 0 0}.back{width:100%;height:48px;margin-top:48px;border:1px solid var(--outline);border-radius:24px;background:var(--surface);color:var(--brand);font-size:16px;font-weight:500;cursor:pointer;transition:transform .12s,background-color .12s}.back:active{transform:scale(.97);background:var(--brand-wash)}
[hidden]{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:430px){body{padding:0;background:var(--page)}.device{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
@media(min-width:560px){.device{width:390px;height:min(844px,94vh)}}
@media(prefers-reduced-motion:reduce){.subnav button,.mode-switch button,.submit,.back,.toast{transition:none}.submit.loading:before{animation:none}}
/* Final native furniture alignment. */
.status-sim{top:0;height:44px}
.page{padding-top:calc(44px + env(safe-area-inset-top));background:linear-gradient(180deg,#D1E3FF 0%,#EBF2FF 100%)}
.back-icon{display:block;width:20px;height:20px;object-fit:contain}
.subnav{position:relative;width:100%;margin-left:0}
.subnav button{position:absolute;left:0}
.page{padding-left:24px;padding-right:24px;background-color:var(--page);background-image:url("../icon/bg.png");background-position:center;background-size:cover;background-repeat:no-repeat}
.brand-hero{position:relative;width:100%;height:126px;margin-top:12px;flex:none}
.brand-lockup{position:absolute;left:0;top:2px;margin:0;align-self:auto}
.login-illustration{position:absolute;z-index:1;top:-4px;right:-18px;width:190px;height:auto;display:block;opacity:.7;user-select:none;-webkit-user-drag:none;pointer-events:none}
.subpage-intro{margin:12px 0 24px}
.subpage-intro{text-align:left}
.subpage-intro,.fallback-card{transform:translateY(-24px)}
.subpage-intro h2{font-size:24px;line-height:32px}
.subpage-intro p{font-size:14px;line-height:20px}
.field input{text-align:left}
.field,.field:focus-within{background:#EEF1F9}
.field input{font-size:16px;font-weight:700}
.prefix{font-size:16px;font-weight:700;color:var(--text)}
.inline-action.is-counting:disabled{color:var(--brand);-webkit-text-fill-color:var(--brand);opacity:1}
.agreement input:checked{width:16px;height:16px;border-color:#0964FC;background:#0964FC}
.agreement input:checked:after{content:"✓";height:100%;display:grid;place-items:center;color:#F8FBFF;font-size:10px;font-weight:700;line-height:1}
.agreement input,.agreement input:checked{appearance:none;width:16px!important;height:16px!important;min-width:16px;max-width:16px;min-height:16px;max-height:16px;box-sizing:border-box;flex:0 0 16px}
.agreement{align-items:center;justify-content:center}
.otp-view{height:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(92px + env(safe-area-inset-top)) clamp(24px,9.23vw,36px) calc(32px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#D1E3FF 0%,#EBF2FF 100%)}.otp-view h2{margin:0;color:var(--text);font-size:32px;line-height:42px;font-weight:700;text-align:center}.otp-view p{margin:10px 0 0;color:var(--text-2);font-size:18px;line-height:26px;text-align:center}.otp-entry{position:relative;width:100%;margin-top:142px}.otp-boxes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:100%}.otp-box{height:72px;border:1px solid rgba(197,207,225,.82);border-radius:16px;background:rgba(252,253,255,.68);display:grid;place-items:center;color:var(--text);font-size:28px;font-weight:700}.otp-box.is-active{border:2px solid var(--brand)}.otp-entry input{position:absolute;inset:0;z-index:2;width:100%;height:100%;opacity:0;cursor:text}.otp-resend{margin-top:32px;border:0;background:transparent;color:var(--text-3);font-size:18px;line-height:26px;cursor:pointer}.otp-resend:not(:disabled){color:var(--brand)}.otp-submit{width:100%;height:48px;margin-top:150px;border:0;border-radius:24px;background:var(--brand);color:#F8FBFF;font-size:17px;font-weight:500;cursor:pointer}.otp-submit:disabled{background:var(--disabled);cursor:default}
</style>
</head>
<body>
<main class="device" aria-label="名络其他手机号登录交互原型">
  <div class="status-sim" aria-label="模拟状态栏，当前电量 80%"><span class="status-sim__time">14:44</span><span class="status-sim__right"><span class="status-sim__signal" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="status-sim__wifi" aria-hidden="true"><i></i></span><span class="status-sim__battery" aria-hidden="true"><i></i></span></span></div>
  <section class="page" id="form-view" aria-labelledby="fallback-title">
    <nav class="subnav" aria-label="其他方式登录导航">
      <button id="back-login" type="button" aria-label="返回登录页"><img class="back-icon" src="../icon/返回.svg" alt=""></button>
      <h1 aria-hidden="true"></h1>
      <span aria-hidden="true"></span>
    </nav>

    <div class="brand-hero">
      <div class="brand-lockup"><img src="../icon/LOGOpng.png" width="306" height="156" alt="名络，连接每一段重要关系"></div>
      <img class="login-illustration" src="../icon/手机登陆.png" width="1222" height="1287" alt="" aria-hidden="true">
    </div>
    <div class="subpage-intro">
      <h2 id="fallback-title">手机号登录</h2>
          <p>使用手机号验证身份</p>
    </div>

    <div class="fallback-card">
      <div class="fallback-notice" id="fallback-notice" hidden role="alert" aria-live="assertive"></div>
      <div class="mode-label" aria-label="当前登录方式">验证码登录</div>

      <form id="login-form" novalidate>
        <label class="field"><span class="prefix">+86</span><input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入手机号" aria-label="手机号"></label>
        <label class="field" id="code-field"><input id="code" name="code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="请输入验证码" aria-label="验证码"><button class="inline-action" id="send-code" type="button" disabled>获取验证码</button></label>
        <div class="error" id="error" role="alert" aria-live="polite"></div>
        <button class="submit" id="submit" type="submit" disabled>登录</button>
        <label class="agreement"><input id="agreement" type="checkbox"><span>我已阅读并同意 <a href="#" data-policy="用户协议">《用户协议》</a> 与 <a href="#" data-policy="隐私政策">《隐私政策》</a></span></label>
      </form>
    </div>

  </section>

  <section class="success-view" id="success-view" hidden aria-labelledby="success-title"><div class="success-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"></path></svg></div><h2 id="success-title">登录成功</h2><p id="success-detail">身份验证已完成<br>此原型不会进入其他业务页面</p><button class="back" id="back-success" type="button">返回登录页</button></section>
  <section class="otp-view" id="otp-view" hidden aria-labelledby="otp-title"><h2 id="otp-title">输入验证码</h2><p id="otp-description">验证码已发送至 <span id="otp-phone">该手机号</span></p><div class="otp-entry"><div class="otp-boxes" aria-hidden="true"><span class="otp-box"></span><span class="otp-box"></span><span class="otp-box"></span><span class="otp-box"></span><span class="otp-box"></span><span class="otp-box"></span></div><input id="otp-code" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="六位验证码"></div><button class="otp-resend" id="otp-resend" type="button" disabled>◷&nbsp; 60秒后重新获取</button><button class="otp-submit" id="otp-submit" type="button" disabled>登录</button></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="consent-modal" id="consent-modal" hidden><div class="consent-backdrop" data-consent-cancel></div><section class="consent-sheet" role="dialog" aria-modal="true" aria-labelledby="consent-title" aria-describedby="consent-description"><h2 id="consent-title">请先同意相关协议</h2><p id="consent-description">登录前需要阅读并同意《用户协议》《隐私政策》。</p><div class="consent-actions"><button class="consent-cancel" id="consent-cancel" type="button">暂不同意</button><button class="consent-confirm" id="consent-confirm" type="button">同意并继续</button></div></section></div>
</main>
<script>
(() => {
  const q = selector => document.querySelector(selector);
  const formView = q('#form-view');
  const otpView = q('#otp-view');
  const successView = q('#success-view');
  const form = q('#login-form');
  const phone = q('#phone');
  const code = q('#code');
  const agreement = q('#agreement');
  const codeField = q('#code-field');
  const sendCode = q('#send-code');
  const submit = q('#submit');
  const error = q('#error');
  const notice = q('#fallback-notice');
  const toast = q('#toast');
  const detail = q('#success-detail');
  const otpCode = q('#otp-code');
  const otpPhone = q('#otp-phone');
  const otpResend = q('#otp-resend');
  const otpSubmit = q('#otp-submit');
  const otpBoxes = [...document.querySelectorAll('.otp-box')];
  const consentModal = q('#consent-modal');
  const consentConfirm = q('#consent-confirm');
  const consentCancel = q('#consent-cancel');
  let timer = null;
  let pendingConsentAction = null;
  let consentTrigger = null;

  const validPhone = () => /^1\d{10}$/.test(phone.value);
  const validCredential = () => /^\d{6}$/.test(code.value);
  const maskedPhone = () => phone.value.length === 11 ? `${phone.value.slice(0, 3)}****${phone.value.slice(-4)}` : '该手机号';
  const renderOtp = () => { otpBoxes.forEach((box, index) => { box.textContent = otpCode.value[index] || ''; box.classList.toggle('is-active', index === otpCode.value.length && otpCode.value.length < 6); }); otpSubmit.disabled = !validCredential(); };
  const showOtpView = () => { formView.hidden = true; otpView.hidden = false; otpPhone.textContent = maskedPhone(); otpCode.value = ''; code.value = ''; renderOtp(); window.setTimeout(() => otpCode.focus(), 0); };
  const update = () => {
    phone.value = phone.value.replace(/\D/g, '').slice(0, 11);
    code.value = code.value.replace(/\D/g, '').slice(0, 6);
    sendCode.disabled = !validPhone() || Boolean(timer);
    submit.disabled = !(validPhone() && validCredential());
    if (error.textContent && validPhone()) error.textContent = '';
    if (phone.value && !notice.hidden) notice.hidden = true;
  };
  const showToast = message => {
    toast.textContent = message;
    toast.classList.add('show');
    window.clearTimeout(showToast.timeout);
    showToast.timeout = window.setTimeout(() => toast.classList.remove('show'), 2200);
  };
  const closeConsent = () => { consentModal.hidden = true; pendingConsentAction = null; consentTrigger?.focus(); };
  const requestConsent = (action, trigger) => { if (agreement.checked) { action(); return; } pendingConsentAction = action; consentTrigger = trigger; consentModal.hidden = false; consentConfirm.focus(); };
  const completeLogin = () => {
    submit.classList.add('loading');
    submit.textContent = '正在登录';
    window.setTimeout(() => {
      submit.classList.remove('loading');
      submit.textContent = '登录';
      window.location.href = 'login-sync.html?source=phone';
    }, 700);
  };

  q('#back-login').addEventListener('click', () => { window.location.href = 'login.html'; });
  [phone, code].forEach(control => control.addEventListener('input', update));
  agreement.addEventListener('change', update);
  sendCode.addEventListener('click', () => {
    if (!validPhone()) { error.textContent = '请输入正确的 11 位手机号'; return; }
    let remaining = 60;
    sendCode.textContent = `${remaining}s 后重发`;
    sendCode.classList.add('is-counting');
    otpResend.textContent = `◷  ${remaining}秒后重新获取`;
    sendCode.disabled = true;
    timer = window.setInterval(() => { remaining -= 1; sendCode.textContent = remaining ? `${remaining}s 后重发` : '重新获取'; otpResend.textContent = remaining ? `◷  ${remaining}秒后重新获取` : '重新获取验证码'; otpResend.disabled = Boolean(remaining); if (!remaining) { window.clearInterval(timer); timer = null; sendCode.classList.remove('is-counting'); update(); } }, 1000);
    showToast('验证码已发送，请注意查收');
    code.focus();
  });
  document.querySelectorAll('[data-policy]').forEach(link => link.addEventListener('click', event => { event.preventDefault(); showToast(`${link.dataset.policy}仅作登录原型入口展示`); }));
  const performSubmit = () => {
    if (!validPhone()) { error.textContent = '请输入正确的 11 位手机号'; phone.focus(); return; }
    if (!validCredential()) { error.textContent = '请输入 6 位验证码'; return; }
    if (code.value === '000000') { error.textContent = '验证码错误，请重新输入'; code.focus(); return; }
    if (!agreement.checked) { requestConsent(completeLogin, submit); return; }
    completeLogin();
  };
  form.addEventListener('submit', event => { event.preventDefault(); performSubmit(); });
  otpCode.addEventListener('input', () => { otpCode.value = otpCode.value.replace(/\D/g, '').slice(0, 6); code.value = otpCode.value; renderOtp(); });
  otpSubmit.addEventListener('click', () => { code.value = otpCode.value; if (code.value === '000000') { showToast('验证码错误，请重新输入'); otpCode.focus(); return; } if (!agreement.checked) { requestConsent(completeLogin, otpSubmit); return; } completeLogin(); });
  otpResend.addEventListener('click', () => { if (!otpResend.disabled) sendCode.click(); });
  consentConfirm.addEventListener('click', () => { agreement.checked = true; update(); const action = pendingConsentAction; consentModal.hidden = true; pendingConsentAction = null; action?.(); });
  consentCancel.addEventListener('click', closeConsent);
  q('[data-consent-cancel]').addEventListener('click', closeConsent);
  q('#back-success').addEventListener('click', () => { window.location.href = 'login.html'; });

  const query = new URLSearchParams(window.location.search);
  const reason = query.get('reason');
  agreement.checked = query.get('agreed') === '1';
  if (reason === 'carrier-fail') {
    notice.textContent = '未获取到本机号码，请使用其他手机号登录';
    notice.hidden = false;
  }
  update();
  window.setTimeout(() => phone.focus(), 0);
})();
</script>
</body>
</html>
